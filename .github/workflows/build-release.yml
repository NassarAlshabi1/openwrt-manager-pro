name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, Build & Sign APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Prepare signing keystore (from secrets or generate ephemeral)
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "source=secret" >> "$GITHUB_OUTPUT"
            echo "STORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS_VAL=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASS_VAL=$KEY_PASS" >> "$GITHUB_ENV"
            echo "Keystore loaded from repository secrets."
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/release.keystore" \
              -alias openwrt-manager-pro -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass openwrtmanager -keypass openwrtmanager \
              -dname "CN=OpenWrt Manager Pro, OU=Mobile, O=NassarAlshabi1, L=NA, S=NA, C=SA"
            echo "source=generated" >> "$GITHUB_OUTPUT"
            echo "STORE_PASS=openwrtmanager" >> "$GITHUB_ENV"
            echo "KEY_ALIAS_VAL=openwrt-manager-pro" >> "$GITHUB_ENV"
            echo "KEY_PASS_VAL=openwrtmanager" >> "$GITHUB_ENV"
            echo "No signing secrets found -> generated an ephemeral keystore for this build."
          fi
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          SIGNING_KEYSTORE: ${{ env.SIGNING_KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ env.STORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ env.KEY_ALIAS_VAL }}
          SIGNING_KEY_PASSWORD: ${{ env.KEY_PASS_VAL }}

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          cp "$APK" "dist/OpenWrtManagerPro-${SAFE_REF}.apk"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          ls -la dist

      - name: Upload unit test results
        if: always() && hashFiles('app/build/test-results/**/*.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrtManagerPro-APK
          path: dist/*.apk

      - name: Upload generated keystore (for reuse as repository secret)
        if: steps.ks.outputs.source == 'generated' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: generated-release-keystore
          path: ${{ runner.temp }}/release.keystore

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          make_latest: true
